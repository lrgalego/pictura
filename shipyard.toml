# The one committed file shipyard reads: everything the deploy engine and the
# scaffold know about this project. `shipyard help` for the commands.

[app]
name       = "story-time"
binaries   = ["server:./cmd/server"]
port       = 8080
health     = "/healthz"
state_dir  = "/data"
# The container writes its SQLite database and generated images here, on the
# mounted volume (the binary defaults to ./data, which is not writable in the
# distroless image).
server_args = ["--data", "/data"]

[build]
private_modules = ["github.com/lrgalego"]

[ui]
htmx_ds = "v0.9.1"

[gate]
coverage_min = 85
coverage_exclude = ["/cmd/server/main.go"]

# The machine this app deploys to. In shared mode, other apps declare the
# same [machine] tables and stay mutually ignorant of each other.
[machine]
mode     = "solo"
name     = "story-time"
provider = "hetzner"

[machine.access]
# address is recorded automatically by `shipyard provision` (hetzner).
port = 22
user = "root"

[machine.hetzner]
location    = "nbg1"
server_type = "cx32"

[registry]
repo = "ghcr.io/lrgalego/story-time"
auth = "token"
user = "lrgalego"

[ingress]
provider  = "cloudflare"
hostname  = "story-time.example.com"
tunnel_id = ""

[secrets]
provider = "op"
